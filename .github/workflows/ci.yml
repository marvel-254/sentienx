name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile src/dashboard/unified_dashboard.py
      - name: Import smoke test
        run: python -c "import streamlit, flask, pandas, numpy, requests, sqlalchemy, websockets; print('OK')"
