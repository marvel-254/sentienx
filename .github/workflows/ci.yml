name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile src/dashboard/unified_dashboard.py src/core/db_adapter.py src/api/server.py
      - name: Import smoke test
        run: python -c "import streamlit, flask, pandas, numpy, requests, sqlalchemy, websockets; print('OK')"
      - name: SQLite regression tests
        run: python -m unittest discover -s src/openstock/tests -p "test_*.py"

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sxtest
          POSTGRES_PASSWORD: sxtest
          POSTGRES_DB: sxtest
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sxtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Postgres end-to-end test
        env:
          DATABASE_URL: postgresql://sxtest:sxtest@localhost:55432/sxtest
        run: python scripts/test_postgres_migration.py
